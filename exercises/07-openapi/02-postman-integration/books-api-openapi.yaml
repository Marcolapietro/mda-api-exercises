openapi: 3.1.0
info:
  title: Books API
  description: A well-documented API for managing books. Compare this to the undocumented
    version!
  version: 1.0.0
servers:
- url: http://127.0.0.1:8000
  description: Local development server
tags:
- name: books
  description: Book management operations
paths:
  /api/books:
    get:
      tags:
      - books
      summary: List all books
      description: Returns a list of books with optional filtering and pagination.
      operationId: list_books_api_books_get
      parameters:
      - name: author
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter books by author name (partial match)
          title: Author
        description: Filter books by author name (partial match)
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          description: Page number for pagination
          default: 1
          title: Page
        description: Page number for pagination
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          description: Number of books per page
          default: 10
          title: Limit
        description: Number of books per page
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Book'
                title: Response List Books Api Books Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - books
      summary: Create a new book
      description: Provide title and author (required), year and isbn (optional).
      operationId: create_book_api_books_post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookCreate'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Book'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/books/{book_id}:
    get:
      tags:
      - books
      summary: Get a book by ID
      description: Returns a single book if it exists, otherwise returns 404.
      operationId: get_book_api_books__book_id__get
      parameters:
      - name: book_id
        in: path
        required: true
        schema:
          type: integer
          title: Book Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Book'
        '404':
          description: Book not found
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    put:
      tags:
      - books
      summary: Update a book
      description: All fields are optional - only provided fields will be updated.
      operationId: update_book_api_books__book_id__put
      parameters:
      - name: book_id
        in: path
        required: true
        schema:
          type: integer
          title: Book Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Book'
        '404':
          description: Book not found
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - books
      summary: Delete a book
      description: Permanently removes the book from the system.
      operationId: delete_book_api_books__book_id__delete
      parameters:
      - name: book_id
        in: path
        required: true
        schema:
          type: integer
          title: Book Id
      responses:
        '204':
          description: Successful Response
        '404':
          description: Book not found
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    Book:
      properties:
        title:
          type: string
          title: Title
          description: Book title
          examples:
          - '1984'
        author:
          type: string
          title: Author
          description: Book author
          examples:
          - George Orwell
        year:
          anyOf:
          - type: integer
          - type: 'null'
          title: Year
          description: Publication year
          examples:
          - 1949
        isbn:
          anyOf:
          - type: string
          - type: 'null'
          title: Isbn
          description: ISBN number
          examples:
          - 978-0451524935
        id:
          type: integer
          title: Id
          description: The book unique identifier
          examples:
          - 1
      type: object
      required:
      - title
      - author
      - id
      title: Book
    BookCreate:
      properties:
        title:
          type: string
          title: Title
          description: Book title
          examples:
          - '1984'
        author:
          type: string
          title: Author
          description: Book author
          examples:
          - George Orwell
        year:
          anyOf:
          - type: integer
          - type: 'null'
          title: Year
          description: Publication year
          examples:
          - 1949
        isbn:
          anyOf:
          - type: string
          - type: 'null'
          title: Isbn
          description: ISBN number
          examples:
          - 978-0451524935
      type: object
      required:
      - title
      - author
      title: BookCreate
    BookUpdate:
      properties:
        title:
          anyOf:
          - type: string
          - type: 'null'
          title: Title
          description: Book title
          examples:
          - 1984 (Updated)
        author:
          anyOf:
          - type: string
          - type: 'null'
          title: Author
          description: Book author
          examples:
          - George Orwell
        year:
          anyOf:
          - type: integer
          - type: 'null'
          title: Year
          description: Publication year
          examples:
          - 1949
        isbn:
          anyOf:
          - type: string
          - type: 'null'
          title: Isbn
          description: ISBN number
          examples:
          - 978-0451524935
      type: object
      title: BookUpdate
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
